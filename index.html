<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Greyfall — The Marshaling Yard</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --soot: #0b0d10;
        --amber: #f3b94a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--soot);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #b3bcc5;
        overflow: hidden;
      }
      #viewport {
        position: fixed;
        inset: 0;
      }
      #viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      /* Dev scaffolding only — the real HUD is src/ui's (DOM overlay). */
      /* Dev strip pinned along the bottom; the HUD reserves room for it. */
      #debug-legend {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        padding: 6px 10px;
        text-align: center;
        background: rgba(11, 13, 16, 0.82);
        border-top: 1px solid rgba(243, 185, 74, 0.28);
        pointer-events: none;
        white-space: pre;
      }
      #debug-legend b {
        color: var(--amber);
        font-weight: 600;
      }
      #debug-status {
        position: fixed;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        z-index: 2;
        padding: 4px 9px;
        background: rgba(11, 13, 16, 0.82);
        border: 1px solid rgba(120, 130, 142, 0.35);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="viewport"><canvas id="battle-canvas"></canvas></div>
    <div id="ui-root"></div>
    <div id="debug-legend"><b>Q/E</b> orbit   <b>wheel</b> zoom   <b>WASD</b> pan (menus closed)   <b>click</b> pick a tile, click again to confirm   <b>X</b> skip presentation</div>
    <div id="debug-status">loading…</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
