<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Greyfall — The Marshaling Yard</title>
    <link rel="icon" href="data:," />
    <style>
      /* The page is only the canvas and the overlay host. Everything the player
         reads — including what the controls do — is the HUD's, in src/ui. */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10; /* SOOT_900 */
        color: #b3bcc5; /* SOOT_100 */
        overflow: hidden;
      }
      #viewport {
        position: fixed;
        inset: 0;
      }
      #viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="viewport"><canvas id="battle-canvas"></canvas></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
